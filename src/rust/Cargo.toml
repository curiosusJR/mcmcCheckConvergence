[package]
name = 'mcmcCheckConvergence'
publish = false
version = '0.2.0'
edition = '2021'
rust-version = '1.65'
build = 'build.rs'

[lib]
crate-type = [ 'staticlib', 'rlib' ]
name = 'mcmcCheckConvergence'

[dependencies]
extendr-api = { version = '0.8.1', optional = true }
rayon = '1.10'
regex = '1.10'

[features]
default = []
r = ['extendr-api']

[profile.release]
lto = true
codegen-units = 1
